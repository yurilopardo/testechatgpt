<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111a15"><title>Tríade — Clareira do Rio</title><style>:root {
  font-family: Inter, "Segoe UI", Arial, sans-serif;
  color: #e3e6d7;
  background: #111a15;
  font-synthesis: none;
  font-weight: 400;
  font-size: 14px;
  color-scheme: dark;
  --bg: #111a15;
  --panel: #18231b;
  --line: #344032;
  --muted: #8e9c89;
  --cream: #e9ebce;
  --lime: #d2dfa0;
  --soft: #becb91;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  min-width: 360px;
  background:
    radial-gradient(ellipse at 50% 35%, #24302055, transparent 65%), #111a15;
}
button,
a {
  -webkit-tap-highlight-color: transparent;
}
button {
  font: inherit;
  cursor: pointer;
  color: inherit;
}
button:disabled {
  cursor: default;
}
button:focus-visible,
a:focus-visible {
  outline: 2px solid #e2e8a8;
  outline-offset: 4px;
}
button {
  transition:
    background 0.15s,
    border-color 0.15s,
    transform 0.15s;
}
button:not(:disabled):active {
  transform: translateY(1px);
}
a {
  color: inherit;
  text-decoration: none;
}
h1,
h2,
h3,
p {
  margin: 0;
}
.icon {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
  vertical-align: middle;
}
kbd {
  font-family: inherit;
  font-size: 10px;
  border: 1px solid #495342;
  border-radius: 3px;
  min-width: 19px;
  height: 19px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #a2ae97;
  background: #ffffff03;
  font-weight: 400;
}
[hidden] {
  display: none !important;
}
.game-shell {
  max-width: 1376px;
  margin: auto;
  padding: 0 48px;
}
.site-header {
  height: 100px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  gap: 24px;
}
.brand {
  display: flex;
  gap: 12px;
  align-items: center;
  color: #e3e8bc;
}
.brand-mark {
  width: 43px;
  height: 43px;
}
.brand > span {
  font-size: 25px;
  font-weight: 650;
  letter-spacing: 6px;
  line-height: 1.2;
}
.brand small {
  display: block;
  font-size: 8px;
  letter-spacing: 2.2px;
  font-weight: 500;
  color: #8f9d80;
  margin-top: 5px;
}
.header-mission {
  font-size: 9px;
  letter-spacing: 2px;
  color: #8d9b83;
  display: flex;
  gap: 13px;
  align-items: center;
}
.tiny-line {
  width: 25px;
  height: 1px;
  background: #71805b;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 25px;
}
.prototype {
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 1.3px;
  color: #a6b58c;
  display: flex;
  align-items: center;
  gap: 8px;
}
.prototype i,
.live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #c0d98a;
  box-shadow: 0 0 10px #bdd18430;
}
.help-btn {
  background: transparent;
  border: 0;
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 11px;
  color: #bfc9b0;
  padding: 8px 0;
}
.help-btn:hover {
  color: #f0edcb;
}
.help-btn .icon {
  width: 16px;
  height: 16px;
}
.mission-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 32px 0 29px;
}
.eyebrow {
  font-size: 9px;
  letter-spacing: 1.6px;
  font-weight: 600;
  color: #a7b58e;
  line-height: 1.5;
}
.mission-header .eyebrow span {
  color: #5e6f50;
  padding: 0 9px;
}
h1 {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 38px;
  letter-spacing: -1.3px;
  font-weight: 400;
  color: #e9ecd8;
  margin: 9px 0 10px;
}
h1 > span {
  color: #b9cc81;
}
.mission-header p {
  font-size: 12px;
  color: #95a18b;
  letter-spacing: 0.1px;
}
.map-strip {
  display: flex;
  align-items: center;
  gap: 22px;
  margin-bottom: 23px;
  padding: 11px 14px;
  border: 1px solid #34432f;
  border-radius: 4px;
  background: #1b281d;
}
.map-terrain {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-right: auto;
  min-width: 0;
}
.map-terrain > .icon {
  width: 19px;
  height: 19px;
  flex-shrink: 0;
  color: #88bfc2;
}
.map-terrain strong,
.map-terrain small {
  display: block;
}
.map-terrain strong {
  color: #ced9bd;
  font-size: 11px;
  font-weight: 500;
}
.map-terrain small {
  color: #8c9f80;
  margin-top: 4px;
  font-size: 8px;
  line-height: 1.5;
}
.map-identity {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.map-identity > span {
  font-size: 7px;
  letter-spacing: 1.2px;
  color: #829575;
}
.map-identity code {
  color: #b6cba0;
  font-size: 10px;
  max-width: 240px;
  overflow-wrap: anywhere;
}
.map-strip .new-map-btn {
  flex-shrink: 0;
  gap: 7px;
  padding: 9px 12px;
  font-size: 9px;
}
.new-map-btn .icon {
  width: 13px;
  height: 13px;
}
@media (max-width: 680px) {
  .map-strip {
    flex-wrap: wrap;
    gap: 10px 16px;
    padding: 11px;
    margin-bottom: 17px;
  }
  .map-terrain {
    flex-basis: calc(100% - 118px);
    gap: 8px;
  }
  .map-terrain small {
    font-size: 7px;
  }
  .map-identity {
    flex-basis: 100%;
    order: 1;
  }
  .map-identity code {
    max-width: none;
    font-size: 9px;
  }
  .map-strip .new-map-btn {
    padding: 9px 10px;
  }
}
.round-display {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 15px 19px;
  border: 1px solid #3a4832;
  border-radius: 5px;
  background: #1b281c;
  min-width: 218px;
}
.round-icon {
  height: 33px;
  width: 33px;
  display: grid;
  place-items: center;
  border: 1px solid #596a3f;
  border-radius: 50%;
  color: #cfdb9d;
}
.round-icon .icon {
  width: 19px;
}
.round-display .eyebrow {
  font-size: 8px;
  color: #b3c094;
  letter-spacing: 1.5px;
  display: block;
  margin-bottom: 3px;
}
.round-display strong {
  font-size: 12px;
  font-weight: 500;
  color: #e2e6c9;
}
.round-display .live-dot {
  margin-left: 14px;
  width: 5px;
  height: 5px;
}
.round-display.enemy-phase {
  border-color: #785247;
  background: #34251e;
}
.enemy-phase .round-icon {
  color: #efb394;
  border-color: #88644c;
}
.enemy-phase .live-dot {
  background: #efa98a;
}
.battle-layout {
  display: grid;
  grid-template-columns: 208px minmax(0, 1fr) 256px;
  gap: 25px;
  align-items: start;
}
.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  min-height: 28px;
  margin-bottom: 12px;
}
.section-heading h2 {
  font-size: 11px;
  letter-spacing: 0.1px;
  font-weight: 500;
  color: #c6cfba;
  display: flex;
  align-items: center;
  gap: 7px;
}
.section-heading > span {
  font-size: 8px;
  color: #859478;
  letter-spacing: 1px;
}
.squad-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.squad-card {
  width: 100%;
  border: 1px solid #34432f;
  background: #19251d;
  border-radius: 4px;
  min-height: 111px;
  text-align: left;
  padding: 14px 11px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: relative;
}
.squad-card:before {
  content: "";
  position: absolute;
  left: -1px;
  top: 24px;
  bottom: 24px;
  width: 3px;
  background: var(--element);
  opacity: 0;
}
.squad-card.selected {
  border-color: #879968;
  background: linear-gradient(100deg, #303c2566, #1b281d);
  box-shadow: 0 0 0 1px #b2c88b12;
}
.squad-card.selected:before {
  opacity: 1;
}
.squad-card:not(:disabled):hover {
  background: #283625;
  border-color: #82956a;
}
.squad-card:disabled:not(.defeated) {
  opacity: 0.7;
}
.portrait-frame {
  width: 61px;
  height: 68px;
  flex-shrink: 0;
  position: relative;
  background: radial-gradient(circle, #65704a33, transparent 75%);
  border-bottom: 1px solid #69704e44;
}
.portrait-frame canvas {
  width: 69px;
  height: 69px;
  position: absolute;
  left: -4px;
  top: -4px;
  image-rendering: pixelated;
}
.element-badge {
  width: 22px;
  height: 22px;
  border: 1px solid #5a6046;
  background: #243027;
  display: grid;
  place-items: center;
  position: absolute;
  right: -3px;
  bottom: -1px;
  color: var(--element);
  border-radius: 50%;
}
.element-badge .icon {
  height: 14px;
  width: 14px;
}
.squad-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.squad-name {
  font-size: 16px;
  font-weight: 550;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: #e5e7d3;
}
.squad-name kbd {
  font-size: 8px;
  width: 16px;
  height: 16px;
  min-width: 16px;
  color: #829172;
  border-color: #44523a;
}
.element-name {
  font-size: 9px;
  color: var(--element);
  letter-spacing: 0.5px;
}
.hearts {
  display: flex;
  gap: 4px;
  align-items: center;
}
.hearts .icon {
  height: 12px;
  width: 12px;
  stroke-width: 1.5;
}
.hearts .full {
  color: var(--element, #df9984);
  fill: var(--element, #df9984);
}
.hearts .empty {
  color: #56634d;
  fill: transparent;
}
.squad-info .hearts {
  margin-top: 3px;
}
.unit-status {
  font-size: 8px;
  color: #a3b18e;
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 4px;
  white-space: nowrap;
}
.unit-status i {
  width: 4px;
  height: 4px;
  background: #c1cf94;
  border-radius: 50%;
}
.unit-status .icon {
  width: 10px;
  height: 10px;
}
.defeated {
  filter: grayscale(1);
  opacity: 0.5;
}
.objective-card {
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  padding: 23px 0 19px;
  margin-top: 25px;
}
.objective-card .eyebrow {
  font-size: 8px;
  letter-spacing: 1.3px;
  color: #9cab87;
  display: flex;
  align-items: center;
  gap: 7px;
}
.objective-card .icon {
  width: 14px;
  height: 14px;
}
.objective-card h3 {
  font-family: Georgia, serif;
  font-weight: 400;
  font-size: 20px;
  color: #dbe0be;
  margin: 12px 0 8px;
}
.objective-card p {
  font-size: 10px;
  line-height: 1.9;
  color: #9eaa90;
}
.objective-progress {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 20px;
  font-size: 9px;
  color: #bbc6a8;
}
.objective-progress > div {
  display: flex;
  gap: 4px;
  flex-shrink: 0;
}
.objective-progress i {
  width: 6px;
  height: 6px;
  border: 1px solid #6f7a59;
  transform: rotate(45deg);
}

.objective-progress i.complete {
  background: #ced998;
  border-color: #ced998;
}
.field-guide {
  padding-top: 23px;
}
.field-guide > .eyebrow {
  font-size: 8px;
  display: block;
  margin-bottom: 15px;
  color: #839475;
}
.field-guide > div {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 9px;
  color: #a6b298;
  margin: 11px 0;
}
.legend-square {
  width: 9px;
  height: 9px;
  display: block;
  border: 1px solid;
}
.movement {
  border-color: #94c6a3;
  background: #8eb99635;
}
.attack {
  border-color: #d1a56b;
  background: #bf945135;
}
.danger {
  border-color: #d88c74;
  background: #b96b5e55;
}
.field-guide > p {
  font-size: 9px;
  color: #84987d;
  padding-top: 10px;
}
.field-guide p .icon {
  height: 13px;
  width: 13px;
  margin-right: 4px;
  color: #86b8b6;
}
.board-topline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 28px;
  font-size: 8px;
  letter-spacing: 0.9px;
  margin-bottom: 12px;
  color: #8e9c80;
}
.board-topline > span:first-child {
  display: flex;
  align-items: center;
  gap: 7px;
  color: #b9c49f;
  letter-spacing: 0.1px;
  font-size: 10px;
}
.board-topline .icon {
  width: 15px;
  height: 15px;
  color: #b7c995;
}
.board-topline i {
  font-style: normal;
  margin: 0 5px;
  color: #58684b;
}
.board-frame {
  padding: 23px 9px 10px 24px;
  position: relative;
  background: #263426;
  border: 1px solid #5c6846;
  box-shadow:
    0 14px 35px #0003,
    inset 0 0 0 4px #1b281d;
  isolation: isolate;
}
.board-surface {
  position: relative;
  aspect-ratio: 1;
  border: 1px solid #819264;
  box-shadow: 0 0 0 2px #15281f;
  background: #64894e;
  overflow: hidden;
}
#battle-canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
}
.grid-input {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);
}
.cell {
  background: transparent;
  border: 0;
  border-radius: 0;
  padding: 0;
  position: relative;
}
.cell:focus-visible {
  outline: 2px solid #f3f0c5;
  outline-offset: -3px;
  z-index: 1;
}
.cell:not(:disabled):active {
  transform: none;
}
.axis {
  position: absolute;
  display: grid;
  color: #9cad82;
  font-size: 8px;
  font-family: monospace;
  pointer-events: none;
}
.axis-top {
  left: 24px;
  right: 9px;
  top: 7px;
  grid-template-columns: repeat(8, 1fr);
  text-align: center;
}
.axis-left {
  top: 23px;
  bottom: 10px;
  left: 8px;
  grid-template-rows: repeat(8, 1fr);
  align-items: center;
}
.board-corner {
  position: absolute;
  pointer-events: none;
  width: 9px;
  height: 9px;
  border-color: #a5b783;
  border-style: solid;
}
.corner-tl {
  left: -1px;
  top: -1px;
  border-width: 2px 0 0 2px;
}
.corner-tr {
  right: -1px;
  top: -1px;
  border-width: 2px 2px 0 0;
}
.corner-bl {
  left: -1px;
  bottom: -1px;
  border-width: 0 0 2px 2px;
}
.corner-br {
  right: -1px;
  bottom: -1px;
  border-width: 0 2px 2px 0;
}
.board-caption {
  height: 41px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  color: #a4b18e;
  font-size: 9px;
  line-height: 1.6;
  padding: 1px 1px 0;
}
.board-caption > span:last-child {
  color: #76876c;
  min-width: 20px;
  text-align: right;
  font-family: monospace;
}
.turn-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid #3b4933;
  padding: 15px 0 0;
  gap: 10px;
}
.turn-summary {
  display: flex;
  align-items: center;
  gap: 9px;
}
.turn-summary > span {
  font-family: Georgia, serif;
  font-size: 26px;
  color: #d2dba7;
  line-height: 1;
}
.turn-summary strong {
  display: block;
  font-size: 9px;
  font-weight: 500;
  color: #c1c9ad;
}
.turn-summary small {
  display: block;
  font-size: 8px;
  color: #7d8f73;
  margin-top: 5px;
}
.end-turn,
.primary-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  background: #d1dca2;
  border: 1px solid #dfe5b6;
  color: #273321;
  font-size: 11px;
  font-weight: 600;
  border-radius: 3px;
  padding: 13px 15px;
  min-height: 43px;
}
.end-turn:hover,
.primary-btn:hover {
  background: #e5ebbc;
}
.end-turn > .icon {
  width: 16px;
  height: 16px;
}
.end-turn kbd {
  width: 17px;
  height: 17px;
  min-width: 17px;
  font-size: 8px;
  border-color: #9ca879;
  color: #576448;
  background: #becb93;
  margin-left: 4px;
}
.end-turn:disabled {
  opacity: 0.5;
}
.end-turn.all-done {
  box-shadow: 0 0 18px #c8db8b1c;
}
.selection-dot {
  width: 5px;
  height: 5px;
  background: #d5e0ad;
  border-radius: 50%;
  margin-right: 3px;
}
.unit-panel {
  background: #19251c;
  border: 1px solid #3b4833;
  border-radius: 4px;
  padding: 16px 15px;
}
.selected-profile {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 82px;
}
.selected-portrait {
  width: 73px;
  height: 77px;
  background: radial-gradient(circle, #93a16c22, transparent 70%);
  display: block;
  margin-left: -5px;
}
.selected-portrait canvas {
  width: 77px;
  height: 77px;
  image-rendering: pixelated;
}
.selected-profile .eyebrow {
  font-size: 8px;
  color: var(--element);
  display: flex;
  align-items: center;
  gap: 4px;
  letter-spacing: 1.3px;
}
.selected-profile .eyebrow .icon {
  width: 12px;
  height: 12px;
}
.selected-profile h3 {
  font-family: Georgia, serif;
  font-weight: 400;
  font-size: 28px;
  letter-spacing: -0.3px;
  margin: 3px 0 5px;
  color: #e6e8d3;
}
.selected-profile > div > span {
  font-size: 8px;
  color: #92a083;
  white-space: nowrap;
}
.unit-stats {
  display: flex;
  justify-content: space-between;
  padding: 16px 0 17px;
  border-bottom: 1px solid #34432e;
  margin-bottom: 18px;
}
.unit-stats > span {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
}
.unit-stats .icon {
  width: 12px;
  height: 12px;
  color: #91a17e;
}
.unit-stats strong {
  font-size: 11px;
  color: #d8dfbb;
  font-weight: 500;
}
.unit-stats small {
  font-size: 8px;
  color: #8f9e7f;
}
.action-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.action-heading .eyebrow {
  font-size: 8px;
  letter-spacing: 1.1px;
  color: #9bab89;
}
.action-pips {
  display: flex;
  gap: 5px;
}
.action-pips i {
  height: 5px;
  width: 5px;
  background: #bccb8c;
  transform: rotate(45deg);
}
.action-pips i.used {
  background: #46533a;
}
.action-buttons {
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.action-btn {
  background: #1d2b20;
  border: 1px solid #3d4c33;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 55px;
  padding: 10px 10px;
  border-radius: 3px;
  text-align: left;
  position: relative;
}
.action-btn > .icon {
  height: 18px;
  width: 18px;
  color: #a8b88c;
}
.action-btn > span:nth-child(2) {
  flex: 1;
  display: flex;
  flex-direction: column;

/* Action forecasts: solid cyan is the immediate shove; violet dashes are next turn. */
.preview-panel {
  margin-top: 16px;
  padding: 14px;
  border: 1px solid #3b4936;
  border-radius: 4px;
  background: #18241c;
}
.preview-panel.has-preview {
  border-color: #648c83;
  background: linear-gradient(135deg, #1d302a, #19251d);
}
.preview-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 10px;
}
.preview-heading h2 {
  font-size: 11px;
  font-weight: 500;
  color: #d5dfbf;
}
.preview-heading > span {
  font-size: 6px;
  letter-spacing: 0.7px;
  color: #8d9e85;
  text-align: right;
}
.preview-empty {
  font-size: 10px;
  line-height: 1.8;
  color: #94a789;
}
.preview-action {
  font-size: 11px;
  color: #9de0df;
  padding-bottom: 10px;
  border-bottom: 1px solid #365044;
}
.preview-panel ul {
  list-style: none;
  padding: 0;
  margin: 0;
}
.preview-panel li {
  padding: 10px 0;
  border-bottom: 1px solid #344536;
}
.preview-panel li > div {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 5px;
  font-size: 10px;
  color: #d8dfc7;
}
.preview-panel strong {
  font-size: 10px;
  font-weight: 500;
}
.preview-panel li > div > span {
  white-space: nowrap;
  color: #e8caa1;
  font-family: monospace;
}
.preview-panel small {
  display: block;
  font-size: 9px;
  line-height: 1.7;
  color: #a9bba0;
  margin-top: 5px;
}
.preview-panel em {
  font-size: 6px;
  letter-spacing: 0.8px;
  font-style: normal;
  color: #efc57f;
  border: 1px solid #8e734a;
  padding: 2px 3px;
}
.preview-ally strong {
  color: #edc57f;
}
.preview-defeated {
  display: block;
  font-size: 9px;
  font-weight: 500;
  color: #f1a48d;
  margin-top: 5px;
}
.preview-structure strong {
  color: #d9ce96;
}
.preview-next {
  padding-top: 13px;
}
.preview-next h3 {
  font-size: 8px;
  letter-spacing: 1px;
  color: #c6b6ea;
  margin-bottom: 9px;
}
.preview-route {
  margin: 9px 0;
  padding-left: 9px;
  border-left: 2px dashed #a99aca;
}
.preview-route strong,
.preview-route > span {
  display: block;
}
.preview-route > span {
  font-size: 10px;
  color: #d0c3e7;
  margin-top: 5px;
  line-height: 1.6;
}
.preview-next > p {
  font-size: 9px;
  line-height: 1.7;
  color: #94a788;
  margin-top: 12px;
}
.preview-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 7px 10px;
  padding-top: 12px;
  font-size: 7px;
  color: #9eb69d;
}
.preview-legend > span {
  display: flex;
  align-items: center;
  gap: 5px;
}
.preview-legend i {
  width: 7px;
  height: 7px;
  display: inline-block;
}
.preview-push-color {
  border: 1px solid #8be5ed;
  background: #8be5ed44;
}
.preview-path-color {
  border: 1px dashed #cab1ff;
  background: #cab1ff33;
}
.preview-victory {
  font-size: 10px;
  line-height: 1.8;
  color: #deeba9;
  margin-top: 10px;
}
@media (max-width: 680px) {
  .preview-panel {
    margin-top: 14px;
    padding: 14px;
  }
  .preview-heading h2 {
    font-size: 12px;
  }
  .preview-heading > span {

  }
  .preview-panel strong,
  .preview-panel li > div,

  }

  }

.change-team-btn {

  color: var(--muted);

.team-dialog {
  width: min(1040px, calc(100vw - 32px));

  padding: 32px;

.team-dialog::backdrop {
  background: #081811e8;

.team-dialog > p {

.team-options {

.team-option {

  align-items: flex-start;

  color: #dfe5ce;
  background: #172d28;
  border: 1px solid #7d9a793d;

  transition:
    border-color 0.15s,

}

.team-option > strong {

}
.team-description {

.team-choice {

.team-restart-note {

/* Only the board changes in the reduced visual experiment. */
.isometric-surface {
  aspect-ratio: 4 / 3;
  background: #111b26;
  border-color: #45606d;
}
.isometric-frame > .axis {
  display: none;
}
.isometric-input {
  display: block;
}
.isometric-input > .cell {
  position: absolute;
  clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
}
.isometric-input > .cell:focus-visible {
  outline: none;
  background: #fff5c21c;
}
.isometric-unit-inputs {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.isometric-unit-target {
  pointer-events: auto;
  position: absolute;
  background: transparent;
  border: 0;
  border-radius: 0;
  padding: 0;
  cursor: pointer;
}
.isometric-unit-target:disabled {
  cursor: default;
}
.isometric-unit-target:focus-visible {
  outline: none;
}

/* Initial placement is a separate step, before any combat actions are spent. */
.deployment-panel {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  margin: 0 0 26px;
  padding: 22px 26px;
  border: 1px solid #65b9d3;
  border-left: 4px solid #9de5f7;
  border-radius: 10px;
  background: linear-gradient(120deg, #193d43, #162a30);
  color: #d9f3f5;
}
.deployment-panel[hidden], .action-buttons[hidden] { display: none; }
.deployment-panel h2 { margin: 5px 0 8px; font-size: 24px; }
.deployment-panel p { max-width: 740px; margin: 0 0 10px; font-size: 14px; line-height: 1.6; }
.deployment-panel strong { font-size: 12px; color: #b4eafa; }
.deployment-panel .primary-btn { flex-shrink: 0; }
.is-deploying .cell.deployment-cell:focus-visible { outline-color: #b6edff; }
@media (max-width: 900px) {

      <dialog id="help-dialog" aria-labelledby="help-title"><button class="dialog-close" data-command="close-dialog" aria-label="Fechar">${$(`close`)}</button><div class="eyebrow">GUIA DE CAMPO</div><h2 id="help-title">Pense um turno à frente.</h2><p>Elimine os 9 inimigos de todas as ondas até o fim do turno 5. Se o prazo acabar ou todo o esquadrão cair, a missão termina.</p><div class="help-steps"><div><b>01</b><span><strong>Escolha e mova</strong>Clique em um aliado e em uma casa verde. Todos os ninjas andam até 3 casas, sem diagonais. Antes de usar uma ação, use Desfazer movimento (Z) para voltar à posição anterior, se a casa estiver livre.</span></div><div><b>02</b><span><strong>Escolha sua ação</strong>Use Soco, um Especial ou Esperar. Você também pode agir sem se mover; a ação encerra a vez da unidade. Aponte uma casa para ver o resultado antes de confirmar.</span></div><div><b>03</b><span><strong>Antecipe o perigo</strong>Sentinelas atacam a casa vizinha. Besteiros atacam em linha reta até 4 casas: o primeiro personagem ou barreira recebe 1 de dano. Árvores, pedras e muralhas bloqueiam o disparo. Após um empurrão, o ataque acompanha a nova posição e mantém a mesma direção. O inimigo sobrevivente ataca ao encerrar o turno, sem voltar a mirar nos aliados.</span></div><div><b>04</b><span><strong>Prepare-se para as ondas</strong>Ao encerrar o turno, os inimigos atacam e avançam até 2 casas. Dos turnos 2 a 5, chegam 1 ou 2 reforços e todos revelam seus próximos ataques. Elimine a última onda antes que o turno 5 termine.</span></div></div><p class="help-push">Soco e Onda Circular empurram personagens, pedras naturais e barreiras por 1 casa. O Soco causa 1 de dano e empurra o personagem mesmo se o golpe zerar seus PV: ele ainda causa 1 de dano no personagem ou estrutura logo atrás. A Onda não causa dano direto. Uma colisão com personagem ou estrutura causa 1 de dano em cada envolvido, sem empurrão em cadeia. Soco contra outro personagem: o alvo perde 2 PV (1 do Soco + 1 da colisão) e o personagem atrás perde apenas 1 PV. Árvores têm 2 PV, sofrem 1 de dano por colisão e exibem copa quebrada e 1/2 PV quando feridas. Árvores e muralhas ficam no lugar. O Soco pode danificar muralhas adjacentes, mas não as empurra; a Onda não as desloca. Muralhas têm 2 PV e bloqueiam a caminhada até serem destruídas. A água pode ser atravessada.</p><div class="help-elements">${Object.entries(T).map(([e,t])=>`<div style="--element:${t.color}">${$(e)}<strong>${t.special}</strong><p>${t.description}</p></div>`).join(``)}</div><div class="help-keyboard"><kbd>WASD / ↑↓←→</kbd> Cursor <kbd>Enter / Espaço</kbd> Confirmar <kbd>Esc</kbd> Cancelar <kbd>Z</kbd> Desfazer movimento <kbd>E</kbd> Encerrar <kbd>1 / 2 / 3</kbd> Unidade</div><button class="primary-btn" data-command="close-dialog">Entendido. Vamos ao campo. ${$(`arrow`)}</button></dialog>
